  <title id="t">Spaniel tail</title>
  <desc>The tail alone, cut from the seated looking-up drawing where it joins the
rump. Same viewBox as dog-up-body.svg, so the two overlay exactly; CSS turns it
about (400, 1265) to wag. Two subpaths of one path, not two paths: the diagonal
between them is then interior to the fill and leaves no seam.</desc>
